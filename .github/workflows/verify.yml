name: Verify JoyNeeds

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://joyneeds:joyneeds@localhost:5432/joyneeds_test
      DIRECT_URL: postgresql://joyneeds:joyneeds@localhost:5432/joyneeds_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: joyneeds
          POSTGRES_PASSWORD: joyneeds
          POSTGRES_DB: joyneeds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U joyneeds -d joyneeds_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply test migrations
        run: npm run db:migrate:deploy

      - name: Seed migrated catalog
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
